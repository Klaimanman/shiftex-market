# Supabase Free projects pause after ~7 days without activity.
# This calls the harmless public.health() function every 3 days.
# Requires repository secrets SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY (both public values).
# Note: GitHub disables scheduled workflows in repos with no commits for 60 days — re-enable from the Actions tab if needed.
name: Keep Supabase awake

on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping health()
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$KEY" ]; then
            echo "Secrets not configured — skipping."; exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/health" \
            -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" -d '{}'
